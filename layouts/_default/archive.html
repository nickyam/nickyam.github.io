{{ define "main" }}
  <div class='hx:mx-auto hx:flex hextra-max-page-width'>
    <article class="hx:w-full hx:break-words hx:flex hx:min-h-[calc(100vh-var(--navbar-height))] hx:min-w-0 hx:justify-center hx:pb-8 hx:pr-[calc(env(safe-area-inset-right)-1.5rem)]">
      <main id="content" class="hx:w-full hx:min-w-0 hextra-max-content-width hx:px-6 hx:pt-4 hx:md:px-12">
        <div class="content">

          <div class="archive-timeline">
            {{- $pages := where .Site.RegularPages "Date.Year" "gt" 1 -}}
            {{- range ($pages.ByDate.Reverse.GroupByDate "2006-01") -}}
              <div class="archive-group">
                <h2 class="archive-month">{{ .Key }}</h2>
                <ul class="archive-list">
                  {{ range .Pages }}
                    <li class="archive-item">
                      <span class="archive-date">{{ .Date.Format "2006-01-02" }}</span>
                      <a href="{{ .RelPermalink }}" class="archive-link">{{ .Title }}</a>
                    </li>
                  {{ end }}
                </ul>
              </div>
            {{ end }}
          </div>
        </div>
      </main>
    </article>
  </div>
{{ end }}
