# Hugo configuration file
title: 涯木
baseURL: "https://nickyam.github.io"

# 重建时清空 public/ 中不再由内容生成的旧文件(如删除/改名的分类、标签页)，
# 避免线上残留死页。2026-09-24 加入。
cleanDestinationDir: true

# 列表摘要长度：Hugo 自动摘要截取前 N 词；中文每个字约等于 1 词，
# 故此处约等于"截取正文前 N 字"。调大=列表显示更长，调小=更短。
summaryLength: 120

# 让 Hugo 把每个汉字当作 1 个词来计数(否则中文无空格整段算 1 词，
# summaryLength 会失效、整段都进摘要)
hasCJKLanguage: true

# SEO and Sitemap
enableRobotsTXT: true
sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.5

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: 首页
      pageRef: /
      weight: 1
    - name: 博客
      pageRef: /blog/
      weight: 2
    - identifier: links
      name: 友链
      weight: 5
    - name: 极限零点
      url: "https://limzero.com"
      parent: links
      weight: 1
    - name: 币链网
      url: "https://0xlib.com"
      parent: links
      weight: 2
    - name: 标签
      pageRef: /tags
      weight: 7
    - name: 归档
      pageRef: /archive
      weight: 8
    - name: 关于
      pageRef: /about
      weight: 9
    - name: Search
      weight: 10
      params:
        type: search
    - name: GitHub
      weight: 11
      url: "https://github.com/nickyam"
      params:
        icon: github
    - name: Theme Toggle
      weight: 12
      params:
        type: theme-toggle

params:
  # page width: full (100%), wide (90rem), normal (1280px)
  page:
    width: wide
    displayPagination: true

  # theme configuration
  theme:
    default: system
    displayToggle: true

  # search configuration
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content

  # image zoom
  imageZoom:
    enable: false

  # blog section configuration
  blog:
    list:
      sortBy: date
      sortOrder: desc
      pagerSize: 10
      displayTags: true
    article:
      displayPagination: true

  # navbar
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: /avatar.png
      width: 28
      height: 28
    width: wide

  # footer
  footer:
    displayCopyright: true
    displayPoweredBy: true
    width: wide

  # edit URL
  editURL:
    enable: false

  # external link decoration
  externalLinkDecoration: true

  # display updated date
  displayUpdatedDate: true
  dateFormat: "2006-01-02"

locale: zh-cn
defaultContentLanguage: zh-cn

enableGitInfo: true

taxonomies:
  category: categories
  tag: tags
